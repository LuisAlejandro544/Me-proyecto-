name: Bundle Linux Tauri (manual, desde el celular)

# Luis: GitHub app > repo > Actions > "Bundle Linux Tauri" > Run workflow.
# Compila .deb + .AppImage en la nube y los deja descargables en Artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias del sistema (WebKit/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install --no-audit --no-fund
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles deb,appimage
      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundles
          path: src-tauri/target/release/bundle/
