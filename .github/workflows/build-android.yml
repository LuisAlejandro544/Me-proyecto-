# Compila APK + Linux + Windows + Web sin PC. Desde el celular:
# GitHub > Actions > Build APK + Linux + Windows > Run workflow, o push a main.
# El APK sale firmado con debug-keys (instalable directo / Uptodown), no Google Play.
# OpenCode en Actions NO edita workflows (requiere GH_PAT); solo hace push y
# este CI compila solo. Para lanzar manual usa la pestaña Actions.
name: Build APK + Linux + Windows

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'android/**'
      - 'linux/**'
      - 'windows/**'
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # En runners frescos es no-op; si algún día se restaura una caché
      # corrupta (como pasó en local), esto la sanea antes de compilar.
      - name: Sanear caché Gradle (anti-corrupción)
        run: |
          ./android/gradlew --stop || true
          rm -rf ~/.gradle/caches/*/transforms
      - name: Build APK por ABI (32 + 64 bits)
        # Si Gradle falla por caché corrupta, se limpia y reintenta 1 vez solo.
        run: |
          flutter build apk --release --split-per-abi || {
            echo "Fallo Gradle: limpiando caché y reintentando..."
            ./android/gradlew --stop || true
            rm -rf ~/.gradle/caches/*/transforms
            flutter build apk --release --split-per-abi
          }
      - name: Build Web (.html preview)
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Instalar deps de escritorio Linux
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - name: Build Linux release
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/Runner/Release
