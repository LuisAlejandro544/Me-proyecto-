# Compila APK Android + Web sin PC. Tu amigo desde el celular:
# GitHub > Actions > Build Android APK > Run workflow, o automático al push.
# El APK sale firmado con debug-keys (instalable directo / Uptodown), no Google Play.
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK por ABI (32 + 64 bits)
        run: flutter build apk --release --split-per-abi

      - name: Build Web (.html preview)
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
