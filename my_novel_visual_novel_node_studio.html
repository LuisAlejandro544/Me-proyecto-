<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Novel — Visual Novel Node Studio</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0d1124;
      --bg-panel: rgba(24, 30, 54, 0.88);
      --border-soft: rgba(120, 145, 215, 0.22);
      --cyan-neon: #00f2fe;
      --coral-neon: #ff756b;
      --accent-purple: #8b5cf6;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-deep);
      color: #f1f5f9;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    /* Canvas Grid + Dots Background matching both reference images */
    .vn-canvas-bg {
      background-color: #0e1326;
      background-image:
        radial-gradient(rgba(148, 163, 218, 0.22) 1.25px, transparent 1.25px),
        linear-gradient(to right, rgba(65, 85, 145, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(65, 85, 145, 0.12) 1px, transparent 1px);
      background-size: 24px 24px, 48px 48px, 48px 48px;
      background-position: 0 0, 0 0, 0 0;
    }
    /* Node Glass Card */
    .vn-node {
      position: absolute;
      background: linear-gradient(165deg, rgba(35, 42, 72, 0.94) 0%, rgba(22, 27, 48, 0.96) 100%);
      border: 1.5px solid rgba(118, 138, 198, 0.28);
      border-radius: 16px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
      cursor: grab;
      z-index: 10;
    }
    .vn-node:active {
      cursor: grabbing;
    }
    .vn-node.selected {
      border-color: rgba(0, 242, 254, 0.75);
      box-shadow: 0 0 0 2px rgba(0, 242, 254, 0.22), 0 18px 40px rgba(0, 0, 0, 0.65);
      z-index: 25;
    }
    /* Choice node frosted look */
    .vn-node-choice {
      background: linear-gradient(165deg, rgba(44, 52, 82, 0.92) 0%, rgba(26, 32, 54, 0.95) 100%);
      border: 1.5px solid rgba(148, 163, 215, 0.34);
    }
    /* Connection Ports */
    .vn-port {
      width: 14px;
      height: 14px;
      border-radius: 9999px;
      position: absolute;
      cursor: crosshair;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      z-index: 30;
    }
    .vn-port:hover {
      transform: scale(1.35);
    }
    .vn-port-cyan {
      background: #00f2fe;
      border: 2.5px solid #0f172a;
      box-shadow: 0 0 10px #00f2fe, 0 0 4px #00f2fe;
    }
    .vn-port-coral {
      background: #ff756b;
      border: 2.5px solid #0f172a;
      box-shadow: 0 0 10px #ff756b, 0 0 4px #ff756b;
    }
    .vn-port-ring-cyan {
      background: #0d1326;
      border: 2.5px solid #00f2fe;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
    }
    .vn-port-ring-coral {
      background: #0d1326;
      border: 2.5px solid #ff756b;
      box-shadow: 0 0 10px rgba(255, 117, 107, 0.8);
    }
    /* Custom Range Sliders matching Character Selector */
    input[type="range"].vn-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, #6366f1 0%, #00f2fe 100%);
      outline: none;
    }
    input[type="range"].vn-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.9);
      cursor: pointer;
      border: 2px solid #e2e8f0;
    }
    /* SVG Wire animations & hover */
    .vn-wire-group {
      cursor: pointer;
    }
    .vn-wire-group:hover .vn-wire-core {
      stroke-width: 4.5px;
      filter: brightness(1.25);
    }
    /* Editable text inputs inside nodes */
    .editable-text {
      user-select: text;
      -webkit-user-select: text;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.5);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden select-none">

  <!-- TOP HEADER BAR (Combines controls from both reference screenshots) -->
  <header class="h-14 px-3 sm:px-5 bg-[#121629]/95 border-b border-slate-700/50 flex items-center justify-between gap-2 z-40 shrink-0 shadow-lg">
    <!-- Left: Back button + Project Selector -->
    <div class="flex items-center gap-2 sm:gap-3">
      <button id="btnResetView" title="Center Canvas View" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/70 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
      </button>

      <div class="relative">
        <button id="btnProjectDropdown" class="flex items-center gap-1.5 text-sm sm:text-base font-medium text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg hover:bg-slate-800/60 transition">
          <span class="text-slate-400 font-normal">Project:</span>
          <span id="currentProjectLabel" class="font-bold text-white">My Novel</span>
          <svg class="w-4 h-4 text-slate-400 ml-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div id="projectDropdownMenu" class="hidden absolute left-0 mt-2 w-72 rounded-xl bg-[#181e36] border border-slate-600/60 shadow-2xl py-2 z-50">
          <div class="px-3 py-1 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Switch Scene Preset</div>
          <button data-preset="sora" class="preset-option w-full text-left px-3.5 py-2.5 text-xs sm:text-sm hover:bg-indigo-500/20 flex items-center justify-between text-white">
            <div>
              <div class="font-semibold text-cyan-300">My Novel — Sora's Route</div>
              <div class="text-[11px] text-slate-400">Start Scene 1 + Forest + Character Selector</div>
            </div>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-400/30">View 1</span>
          </button>
          <button data-preset="aoi" class="preset-option w-full text-left px-3.5 py-2.5 text-xs sm:text-sm hover:bg-indigo-500/20 flex items-center justify-between text-white">
            <div>
              <div class="font-semibold text-rose-300">My Novel — Aoi's Meetup</div>
              <div class="text-[11px] text-slate-400">Decision Split + Apology / Tease Branches</div>
            </div>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-400/30">View 2</span>
          </button>
          <div class="border-t border-slate-700/60 my-1"></div>
          <button data-preset="blank" class="preset-option w-full text-left px-3.5 py-2 text-xs sm:text-sm hover:bg-slate-700/50 text-slate-300 flex items-center gap-2">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            New Blank Story Graph
          </button>
        </div>
      </div>
    </div>

    <!-- Center: Preview / Play + Undo/Redo + Zoom % -->
    <div class="flex items-center gap-2 sm:gap-3">
      <button id="btnPlayPreviewTop" class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-gradient-to-r from-[#232b4a] to-[#2c3558] hover:from-[#2d3860] hover:to-[#37426d] border border-cyan-400/40 shadow-[0_0_15px_rgba(0,242,254,0.18)] text-xs sm:text-sm font-medium text-white transition">
        <svg class="w-3.5 h-3.5 text-cyan-400 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span>Preview</span>
        <span class="hidden md:inline text-slate-400 font-normal">(Play)</span>
      </button>

      <div class="hidden sm:flex items-center bg-[#181e36] border border-slate-700/70 rounded-lg px-1.5 py-1 gap-1">
        <button id="btnUndo" title="Undo (Ctrl+Z)" class="p-1 text-slate-400 hover:text-white rounded hover:bg-slate-700/50 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a5 5 0 015 5v2M3 10l4-4m-4 4l4 4"/></svg>
        </button>
        <button id="btnRedo" title="Redo (Ctrl+Y)" class="p-1 text-slate-400 hover:text-white rounded hover:bg-slate-700/50 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 10H11a5 5 0 00-5 5v2m15-7l-4-4m4 4l-4 4"/></svg>
        </button>
        <div class="h-3.5 w-[1px] bg-slate-700 mx-0.5"></div>
        <button id="btnZoomResetTop" class="px-2 py-0.5 text-xs text-slate-300 hover:text-white font-medium">
          <span id="topZoomLabel">92%</span>
        </button>
      </div>
    </div>

    <!-- Right: Export Win (.exe) & Web (.html) + Settings -->
    <div class="flex items-center gap-2">
      <span class="hidden lg:inline text-xs text-slate-400 mr-0.5">Export:</span>

      <button id="btnExportExe" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#15233b] hover:bg-[#1c3050] border border-cyan-400/60 shadow-[0_0_12px_rgba(0,242,254,0.2)] text-xs font-medium text-cyan-200 transition">
        <svg class="w-3.5 h-3.5 text-cyan-400 fill-current" viewBox="0 0 24 24">
          <path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.9-1.801"/>
        </svg>
        <span>Win (.exe)</span>
      </button>

      <button id="btnExportHtml" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#2a1c27] hover:bg-[#3b2536] border border-rose-400/60 shadow-[0_0_12px_rgba(255,117,107,0.2)] text-xs font-medium text-rose-200 transition">
        <svg class="w-3.5 h-3.5 text-orange-400 fill-current" viewBox="0 0 24 24">
          <path d="M1.5 0h21l-1.91 21.563L11.977 24l-8.564-2.438L1.5 0zm7.031 9.75l-.232-2.718 10.059.003.23-2.622L5.412 4.41l.698 8.01h9.126l-.326 3.426-2.91.804-2.955-.81-.188-2.11H6.248l.33 4.171L12 19.351l5.379-1.443.744-8.157H8.531z"/>
        </svg>
        <span>Web (.html)</span>
      </button>

      <button id="btnTopSettings" title="Global Settings" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/70 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN WORKSPACE AREA -->
  <main id="canvasViewport" class="relative flex-1 w-full overflow-hidden vn-canvas-bg cursor-grab active:cursor-grabbing">

    <!-- Quick Mode Switcher Pill (Top-Left floating helper to compare View 1 & View 2 effortlessly) -->
    <div class="absolute top-3 left-3 z-30 flex items-center gap-1.5 bg-[#161c33]/90 backdrop-blur-md border border-slate-700/70 rounded-full p-1 shadow-lg">
      <button id="pillPresetSora" class="px-3 py-1 rounded-full text-xs font-semibold transition bg-cyan-500/20 text-cyan-300 border border-cyan-400/40">
        Scene 1: Sora (Mobile UI)
      </button>
      <button id="pillPresetAoi" class="px-3 py-1 rounded-full text-xs font-semibold transition text-slate-400 hover:text-white">
        Scene 2: Aoi (Tablet UI)
      </button>
      <span class="hidden md:inline-block text-[11px] text-slate-400 px-2 border-l border-slate-700/70">
        Drag nodes or ports • Double-click text to edit
      </span>
    </div>

    <!-- Transformable World Container (Nodes + SVG Wires) -->
    <div id="canvasWorld" class="absolute inset-0 origin-top-left" style="transform: translate(0px, 0px) scale(1);">
      <!-- SVG Layer for Glowing Bezier Wires -->
      <svg id="wiresSvg" class="absolute inset-0 w-[4000px] h-[3000px] pointer-events-none overflow-visible" style="z-index: 5;">
        <defs>
          <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="5" result="blur1" />
            <feGaussianBlur stdDeviation="10" result="blur2" />
            <feMerge>
              <feMergeNode in="blur2" />
              <feMergeNode in="blur1" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="glow-coral" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="5" result="blur1" />
            <feGaussianBlur stdDeviation="10" result="blur2" />
            <feMerge>
              <feMergeNode in="blur2" />
              <feMergeNode in="blur1" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <g id="wiresLayer" class="pointer-events-auto"></g>
        <path id="tempDragWire" class="hidden" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-dasharray="6 4" filter="url(#glow-cyan)" />
      </svg>

      <!-- Nodes Container -->
      <div id="nodesLayer" class="relative w-full h-full"></div>
    </div>

    <!-- Floating Bottom-Left Zoom / Pan Pill (from Image 1) -->
    <div class="absolute bottom-4 left-4 z-30 flex items-center gap-2.5 px-3.5 py-2 rounded-xl bg-[#171c32]/90 backdrop-blur-md border border-slate-700/70 shadow-xl">
      <button id="btnZoomOutPill" title="Zoom Out" class="text-slate-300 hover:text-cyan-300 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"/></svg>
      </button>
      <span id="pillZoomLabel" class="text-xs sm:text-sm font-semibold text-slate-100 min-w-[38px] text-center">92%</span>
      <button id="btnCenterCanvas" title="Recenter Graph" class="text-slate-400 hover:text-white transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
      </button>
      <button id="btnFitGraph" title="Auto-Fit All Nodes" class="text-slate-400 hover:text-white transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      </button>
    </div>

    <!-- Floating Bottom-Right Controls: Glowing "+" FAB (Image 1) + Interactive Mini-map (Image 2) -->
    <div class="absolute bottom-4 right-4 z-30 flex items-end gap-3">
      <!-- Glowing Add Node FAB from Image 1 -->
      <button id="btnFabAddNode" title="Add New Node" class="w-12 h-12 rounded-2xl bg-gradient-to-br from-cyan-400 via-indigo-500 to-purple-600 p-[1.5px] shadow-[0_0_25px_rgba(0,242,254,0.4)] hover:scale-105 active:scale-95 transition">
        <div class="w-full h-full rounded-[14px] bg-[#1e294b]/80 backdrop-blur-sm flex items-center justify-center text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m-7-7h14"/></svg>
        </div>
      </button>

      <!-- Mini-map & Zoom Widget from Image 2 -->
      <div class="hidden sm:flex flex-col w-36 rounded-xl bg-[#161c32]/95 backdrop-blur-md border border-slate-700/80 shadow-2xl overflow-hidden">
        <div class="relative h-20 w-full bg-[#0d1122] p-1.5 border-b border-slate-700/60">
          <svg id="minimapSvg" viewBox="0 0 1000 600" class="w-full h-full overflow-visible"></svg>
        </div>
        <div class="flex items-center justify-between px-2.5 py-1.5 text-xs font-medium text-slate-300">
          <button id="btnMinimapZoomOut" class="hover:text-white px-1 font-bold">−</button>
          <span id="minimapZoomLabel">92%</span>
          <button id="btnMinimapZoomIn" class="hover:text-white px-1 font-bold">+</button>
        </div>
      </div>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR (Combines Image 1 & Image 2 tabs seamlessly) -->
  <footer class="h-16 bg-[#111526]/95 border-t border-slate-800/80 px-2 sm:px-6 flex items-center justify-around sm:justify-center sm:gap-6 md:gap-10 z-40 shrink-0">
    <!-- Tab 1: Nodes / Add Node -->
    <button data-tab="nodes" class="nav-tab-btn group relative flex items-center gap-2 px-3 py-2 rounded-xl text-cyan-300 font-medium text-xs sm:text-sm transition">
      <div class="absolute -top-2.5 left-1/2 -translate-x-1/2 w-12 h-1 rounded-full bg-gradient-to-r from-cyan-400 to-purple-500 nav-indicator"></div>
      <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
      </svg>
      <div class="text-left">
        <div>Nodes</div>
        <div class="hidden md:block text-[10px] text-slate-400 font-normal">+ Add Node</div>
      </div>
    </button>

    <!-- Tab 2: Assets -->
    <button data-tab="assets" class="nav-tab-btn group relative flex items-center gap-2 px-3 py-2 rounded-xl text-slate-400 hover:text-white font-medium text-xs sm:text-sm transition">
      <svg class="w-5 h-5 text-orange-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
      </svg>
      <div class="text-left">
        <div>Assets</div>
        <div class="hidden md:block text-[10px] text-slate-500 font-normal">Sprites & BG</div>
      </div>
    </button>

    <!-- Tab 3: Timeline & Variables -->
    <button data-tab="timeline" class="nav-tab-btn group relative flex items-center gap-2 px-3 py-2 rounded-xl text-slate-400 hover:text-white font-medium text-xs sm:text-sm transition">
      <svg class="w-5 h-5 text-pink-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
      </svg>
      <div class="text-left">
        <div>Timeline</div>
        <div class="hidden md:block text-[10px] text-slate-500 font-normal">Variables</div>
      </div>
    </button>

    <!-- Tab 4: Characters -->
    <button data-tab="characters" class="nav-tab-btn hidden sm:flex group relative items-center gap-2 px-3 py-2 rounded-xl text-slate-400 hover:text-white font-medium text-xs sm:text-sm transition">
      <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      <div class="text-left">
        <div>Characters</div>

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.06);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'connect') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(960, now + 0.14);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'choice') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.11);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        }
      } catch (e) {}
    }

    function pushHistory() {
      historyStack.push(JSON.parse(JSON.stringify({ nodes: state.nodes, wires: state.wires, variables: state.variables })));
      if (historyStack.length > 30) historyStack.shift();
      redoStack = [];
    }

    function showToast(msg) {
      const banner = document.getElementById('toastBanner');
      document.getElementById('toastMessage').textContent = msg;
      banner.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => banner.classList.add('hidden'), 2400);
    }

    // =========================================================================
    // PORT COORDINATE CALCULATION & SVG BEZIER RENDERING
    // =========================================================================
    function getPortPosition(nodeId, portId) {
      const node = state.nodes.find(n => n.id === nodeId);
      if (!node) return { x: 0, y: 0 };

      // Check DOM element first for exact visual alignment
      const portEl = document.querySelector(`[data-node-id="${nodeId}"][data-port-id="${portId}"]`);
      const worldEl = document.getElementById('canvasWorld');
      if (portEl && worldEl) {
        const portRect = portEl.getBoundingClientRect();
        const worldRect = worldEl.getBoundingClientRect();
        const x = (portRect.left + portRect.width / 2 - worldRect.left) / state.zoom;
        const y = (portRect.top + portRect.height / 2 - worldRect.top) / state.zoom;
        return { x, y };
      }

      // Fallback geometric calculation
      const isInput = portId.startsWith('in_');
      return {
        x: isInput ? node.x : node.x + (node.width || 240),
        y: node.y + 80
      };
    }

    function buildBezierPath(x1, y1, x2, y2) {
      const dx = Math.max(Math.abs(x2 - x1) * 0.55, 60);
      return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    }

    function renderWires() {
      const wiresLayer = document.getElementById('wiresLayer');
      wiresLayer.innerHTML = '';

      state.wires.forEach(wire => {
        const p1 = getPortPosition(wire.fromNode, wire.fromPort);
        const p2 = getPortPosition(wire.toNode, wire.toPort);
        const d = buildBezierPath(p1.x, p1.y, p2.x, p2.y);
        const isCyan = wire.color === 'cyan';
        const strokeColor = isCyan ? '#00f2fe' : '#ff756b';
        const glowFilter = isCyan ? 'url(#glow-cyan)' : 'url(#glow-coral)';

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'vn-wire-group');
        g.dataset.wireId = wire.id;

        // Outer soft glow path
        const glowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        glowPath.setAttribute('d', d);
        glowPath.setAttribute('fill', 'none');
        glowPath.setAttribute('stroke', strokeColor);
        glowPath.setAttribute('stroke-width', '6');
        glowPath.setAttribute('stroke-opacity', '0.32');
        glowPath.setAttribute('filter', glowFilter);

        // Core neon wire path
        const corePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        corePath.setAttribute('d', d);
        corePath.setAttribute('class', 'vn-wire-core transition-all');
        corePath.setAttribute('fill', 'none');
        corePath.setAttribute('stroke', strokeColor);
        corePath.setAttribute('stroke-width', '3');
        corePath.setAttribute('stroke-linecap', 'round');

        // Invisible thicker hit area for clicking wire to toggle color or delete
        const hitPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        hitPath.setAttribute('d', d);
        hitPath.setAttribute('fill', 'none');
        hitPath.setAttribute('stroke', 'transparent');
        hitPath.setAttribute('stroke-width', '16');

        g.appendChild(glowPath);
        g.appendChild(corePath);
        g.appendChild(hitPath);

        g.addEventListener('click', (e) => {
          e.stopPropagation();
          pushHistory();
          if (e.shiftKey) {
            state.wires = state.wires.filter(w => w.id !== wire.id);
            showToast('Connection removed');
          } else {
            wire.color = wire.color === 'cyan' ? 'coral' : 'cyan';
            showToast(`Wire color switched to ${wire.color.toUpperCase()} (Shift+Click to delete)`);
          }
          playSynthSfx('click');
          renderWires();
          renderMinimap();
        });

        wiresLayer.appendChild(g);
      });

      renderMinimap();
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // =========================================================================
    // DRAGGING NODES, PORTS, SLIDERS & INLINE EDITING
    // =========================================================================
    let dragState = null;

    function attachNodeInteractions() {
      // Node selection & drag start
      document.querySelectorAll('.vn-node').forEach(nodeEl => {
        nodeEl.addEventListener('pointerdown', (e) => {
          if (e.target.closest('.vn-port') || e.target.closest('button') || e.target.closest('select') || e.target.closest('input')) {
            return;
          }
          e.stopPropagation();
          const nodeId = nodeEl.dataset.nodeId;
          selectedNodeId = nodeId;
          document.querySelectorAll('.vn-node').forEach(n => n.classList.toggle('selected', n.dataset.nodeId === nodeId));

          const node = state.nodes.find(n => n.id === nodeId);
          if (!node) return;

          dragState = {
            mode: 'node',
            nodeId,
            startX: e.clientX,
            startY: e.clientY,
            origX: node.x,
            origY: node.y,
            moved: false
          };
        });
      });

      // Port drag to create new connection wire
      document.querySelectorAll('.vn-port').forEach(portEl => {
        portEl.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          e.preventDefault();
          const nodeId = portEl.dataset.nodeId;
          const portId = portEl.dataset.portId;
          const color = portEl.dataset.portColor || 'cyan';
          const startPos = getPortPosition(nodeId, portId);

          dragState = {
            mode: 'wire',
            fromNode: nodeId,
            fromPort: portId,
            color,
            startX: startPos.x,
            startY: startPos.y
          };

          const tempWire = document.getElementById('tempDragWire');
          tempWire.setAttribute('stroke', color === 'coral' ? '#ff756b' : '#00f2fe');
          tempWire.setAttribute('filter', color === 'coral' ? 'url(#glow-coral)' : 'url(#glow-cyan)');
          tempWire.classList.remove('hidden');
          tempWire.setAttribute('d', buildBezierPath(startPos.x, startPos.y, startPos.x + 10, startPos.y));
        });
      });

      // Double-click text fields to edit inline
      document.querySelectorAll('.editable-field').forEach(fieldEl => {
        fieldEl.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          const nodeEl = fieldEl.closest('.vn-node');
          const node = state.nodes.find(n => n.id === nodeEl?.dataset.nodeId);
          const prop = fieldEl.dataset.field;
          if (!node || !prop) return;
          openInlineEditorModal(node, prop, fieldEl.textContent);
        });
      });

      document.querySelectorAll('.editable-option').forEach(optEl => {
        optEl.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          const nodeEl = optEl.closest('.vn-node');
          const node = state.nodes.find(n => n.id === nodeEl?.dataset.nodeId);
          const idx = parseInt(optEl.dataset.optIdx, 10);
          if (!node || !node.options || !node.options[idx]) return;
          openInlineOptionModal(node, idx);
        });
      });

      // Node internal buttons & sliders
      document.querySelectorAll('[data-action]').forEach(ctrl => {
        const action = ctrl.dataset.action;
        const nodeId = ctrl.dataset.node;
        const node = state.nodes.find(n => n.id === nodeId);
        if (!node) return;

        if (action === 'cycle-char') {
          ctrl.addEventListener('click', (e) => {
            e.stopPropagation();
            pushHistory();
            const keys = Object.keys(CHARACTER_ASSETS);
            const nextIdx = (keys.indexOf(node.characterId) + 1) % keys.length;
            node.characterId = keys[nextIdx];
            node.speaker = CHARACTER_ASSETS[node.characterId].name;
            playSynthSfx('click');
            renderNodes();
          });
        } else if (action === 'add-choice-opt') {
          ctrl.addEventListener('click', (e) => {
            e.stopPropagation();
            pushHistory();
            const nextNum = (node.options?.length || 0) + 1;
            const optId = 'opt_' + Date.now().toString(36);
            node.options.push({
              id: optId,
              label: `Option ${nextNum}: "New branch"`,
              style: nextNum % 2 === 0 ? 'teal' : 'coral',
              inColor: 'cyan',
              outColor: nextNum % 2 === 0 ? 'cyan' : 'coral'
            });
            playSynthSfx('click');
            renderNodes();
            showToast('Added new choice option');
          });
        } else if (action === 'select-char') {
          ctrl.addEventListener('click', (e) => {
            e.stopPropagation();
            pushHistory();
            const charKey = ctrl.dataset.char;
            node.selectedCharId = charKey;
            node.expression = CHARACTER_ASSETS[charKey].expressions[0];
            playSynthSfx('click');
            renderNodes();
          });
        } else if (action === 'char-prev' || action === 'char-next') {
          ctrl.addEventListener('click', (e) => {
            e.stopPropagation();
            const keys = Object.keys(CHARACTER_ASSETS);
            const cur = keys.indexOf(node.selectedCharId || 'yuki');
            const next = action === 'char-next' ? (cur + 1) % keys.length : (cur - 1 + keys.length) % keys.length;
            node.selectedCharId = keys[next];
            node.expression = CHARACTER_ASSETS[keys[next]].expressions[0];
            playSynthSfx('click');
            renderNodes();
          });
        } else if (action === 'change-expr') {
          ctrl.addEventListener('change', (e) => {
            node.expression = e.target.value;
            playSynthSfx('click');
            showToast(`Expression set to ${node.expression}`);
          });
        } else if (action === 'slider-scale') {
          ctrl.addEventListener('input', (e) => {
            node.scale = parseInt(e.target.value, 10);
            const lbl = document.getElementById(`scaleVal_${node.id}`);
            if (lbl) lbl.textContent = `${node.scale}%`;
          });
        } else if (action === 'slider-pos') {
          ctrl.addEventListener('input', (e) => {
            node.position = parseInt(e.target.value, 10);
            const lbl = document.getElementById(`posVal_${node.id}`);
            if (lbl) lbl.textContent = `${node.position}%`;
          });
        }
      });
    }

    // Canvas Panning & Global Pointer Move/Up
    const viewport = document.getElementById('canvasViewport');
    viewport.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.vn-node') || e.target.closest('button')) return;
      dragState = {
        mode: 'pan',
        startX: e.clientX,
        startY: e.clientY,
        origPanX: state.panX,
        origPanY: state.panY
      };
    });

    window.addEventListener('pointermove', (e) => {
      if (!dragState) return;

      if (dragState.mode === 'node') {
        const dx = (e.clientX - dragState.startX) / state.zoom;
        const dy = (e.clientY - dragState.startY) / state.zoom;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragState.moved = true;

        const node = state.nodes.find(n => n.id === dragState.nodeId);
        if (node) {
          node.x = Math.round(dragState.origX + dx);
          node.y = Math.round(dragState.origY + dy);
          const el = document.querySelector(`.vn-node[data-node-id="${node.id}"]`);
          if (el) {
            el.style.left = `${node.x}px`;
            el.style.top = `${node.y}px`;
          }
          renderWires();
        }
      } else if (dragState.mode === 'pan') {
        state.panX = dragState.origPanX + (e.clientX - dragState.startX);
        state.panY = dragState.origPanY + (e.clientY - dragState.startY);
        applyTransform();
      } else if (dragState.mode === 'wire') {
        const worldEl = document.getElementById('canvasWorld');
        const worldRect = worldEl.getBoundingClientRect();
        const curX = (e.clientX - worldRect.left) / state.zoom;
        const curY = (e.clientY - worldRect.top) / state.zoom;
        const tempWire = document.getElementById('tempDragWire');
        tempWire.setAttribute('d', buildBezierPath(dragState.startX, dragState.startY, curX, curY));
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!dragState) return;

      if (dragState.mode === 'wire') {
        const tempWire = document.getElementById('tempDragWire');
        tempWire.classList.add('hidden');

        const targetPort = document.elementFromPoint(e.clientX, e.clientY)?.closest('.vn-port');
        if (targetPort && targetPort.dataset.nodeId !== dragState.fromNode) {
          pushHistory();
          state.wires.push({
            id: 'w_' + Date.now().toString(36),
            fromNode: dragState.fromNode,
            fromPort: dragState.fromPort,
            toNode: targetPort.dataset.nodeId,
            toPort: targetPort.dataset.portId,
            color: dragState.color
          });
          playSynthSfx('connect');
          renderWires();
          showToast('Nodes connected!');
        }
      } else if (dragState.mode === 'node' && dragState.moved) {
        pushHistory();
      }

      dragState = null;
    });

    // Wheel Zoom
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.06 : -0.06;
      setZoom(Math.min(1.5, Math.max(0.45, state.zoom + delta)));
    }, { passive: false });

    function setZoom(newZoom) {
      state.zoom = Math.round(newZoom * 100) / 100;
      applyTransform();
      renderWires();
    }

    function applyTransform() {
      const world = document.getElementById('canvasWorld');
      world.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
      const pct = `${Math.round(state.zoom * 100)}%`;
      document.getElementById('topZoomLabel').textContent = pct;
      document.getElementById('pillZoomLabel').textContent = pct;
      document.getElementById('minimapZoomLabel').textContent = pct;
    }

    // =========================================================================
    // MINI-MAP RENDERER (Matches Bottom-Right Widget in Image 2)
    // =========================================================================
    function renderMinimap() {
      const svg = document.getElementById('minimapSvg');
      if (!svg) return;
      let html = '';

      // Draw wires in minimap
      state.wires.forEach(w => {
        const n1 = state.nodes.find(n => n.id === w.fromNode);
        const n2 = state.nodes.find(n => n.id === w.toNode);
        if (!n1 || !n2) return;
        const x1 = n1.x + (n1.width || 220);
        const y1 = n1.y + 70;
        const x2 = n2.x;
        const y2 = n2.y + 70;
        const stroke = w.color === 'coral' ? '#ff756b' : '#00f2fe';
        html += `<path d="${buildBezierPath(x1, y1, x2, y2)}" fill="none" stroke="${stroke}" stroke-width="14" />`;
      });

      // Draw node rectangles in minimap
      state.nodes.forEach(n => {
        const fill = n.type === 'choice' ? '#334155' : '#38bdf8';
        html += `<rect x="${n.x}" y="${n.y}" width="${n.width || 220}" height="130" rx="20" fill="${fill}" fill-opacity="0.65" stroke="#94a3b8" stroke-width="6" />`;
      });

      svg.innerHTML = html;
    }

    let currentPlayNodeId = null;

    function startPlaytest() {
      playSynthSfx('click');
      const modal = document.getElementById('playtestModal');

    function renderPlaytestStep(nodeId) {
      currentPlayNodeId = nodeId;
      const node = state.nodes.find(n => n.id === nodeId);
      if (!node) return;

      document.getElementById('vnCurrentNodeBadge').textContent =
        node.badge || node.headerBar || node.title || node.topTitle || node.id;

      // Check if there is a Character Selector node in the graph for scale/position
      const charSelector = state.nodes.find(n => n.type === 'character_selector');
      const scalePct = charSelector ? charSelector.scale : 100;
      const posPct = charSelector ? charSelector.position : 50;

      const spriteImg = document.getElementById('vnCharacterSprite');
      const spriteWrap = document.getElementById('vnSpriteContainer');
      const charKey = node.characterId || node.selectedCharId || 'sora';
      const charObj = CHARACTER_ASSETS[charKey] || CHARACTER_ASSETS.sora;

      spriteImg.src = node.type === 'banner_scene' ? charObj.banner : charObj.avatar;
      spriteWrap.style.transform = `translateX(${(posPct - 50) * 2.2}px) scale(${scalePct / 100})`;

      document.getElementById('vnSpeakerName').textContent = node.speaker || charObj.name;
      document.getElementById('vnSpeakerName').style.color = node.speakerColor || charObj.color;
      document.getElementById('vnExpressionTag').textContent =
        `${charSelector?.expression || charObj.expressions[0]} • Scale ${scalePct}%`;

      const dialogueEl = document.getElementById('vnDialogueText');
      if (node.type === 'choice') {
        dialogueEl.textContent = 'Select your next decision:';
      } else if (node.type === 'character_selector') {
        dialogueEl.textContent = `${charObj.name} enters the scene (${node.expression})!`;
      } else {
        dialogueEl.textContent = node.dialogue || '...';
      }

      // Render story variables readout
      const varsEl = document.getElementById('vnVariablesReadout');
      varsEl.innerHTML = Object.entries(state.variables || {})
        .map(([k, v]) => `<span class="px-2 py-0.5 rounded bg-slate-800 text-cyan-300 font-mono">${escapeHtml(k)}: ${escapeHtml(String(v))}</span>`)
        .join('');

      // Check outgoing connections
      const outWires = state.wires.filter(w => w.fromNode === node.id);
      const choicesOverlay = document.getElementById('vnChoicesOverlay');
      const nextBtn = document.getElementById('btnVnNext');

      // If this node is a choice node, show interactive choice buttons
      if (node.type === 'choice' && node.options?.length) {
        choicesOverlay.innerHTML = '';
        choicesOverlay.classList.remove('hidden');
        nextBtn.classList.add('opacity-40', 'pointer-events-none');

        node.options.forEach(opt => {
          const wire = outWires.find(w => w.fromPort === `out_${opt.id}`);
          const targetNodeId = wire ? wire.toNode : null;
          const btn = document.createElement('button');
          btn.className = 'w-full max-w-md px-5 py-3.5 rounded-2xl bg-[#1b2340]/95 hover:bg-cyan-500/25 border-2 border-cyan-400/50 text-sm sm:text-base font-semibold text-white shadow-2xl transition transform hover:scale-[1.02] flex items-center justify-between';
          btn.innerHTML = `
            <span>${escapeHtml(opt.label)}</span>
            <span class="text-xs text-cyan-300 ml-2">→</span>
          `;
          btn.onclick = () => {
            playSynthSfx('choice');
            if (targetNodeId) {
              renderPlaytestStep(targetNodeId);
            } else {
              choicesOverlay.classList.add('hidden');
              dialogueEl.textContent = `[Chosen: ${opt.label}] — End of this branch! Connect an output wire in the editor to continue.`;
            }
          };
          choicesOverlay.appendChild(btn);
        });
      } else {
        choicesOverlay.classList.add('hidden');
        nextBtn.classList.remove('opacity-40', 'pointer-events-none');
        nextBtn.onclick = () => {
          playSynthSfx('click');
          if (outWires.length > 0) {
            renderPlaytestStep(outWires[0].toNode);
          } else {
            showToast('Reached the end of this story branch!');
          }
        };
      }
    }

    function addNewNodeOfType(type) {
      pushHistory();
      const id = 'node_' + Date.now().toString(36);
      const offsetX = Math.round((180 - state.panX) / state.zoom + (Math.random() * 80));
      const offsetY = Math.round((140 - state.panY) / state.zoom + (Math.random() * 60));

      if (type === 'banner_scene') {
        state.nodes.push({
          id,
          type: 'banner_scene',
          badge: `Scene ${state.nodes.length + 1}`,
          x: offsetX,
          y: offsetY,
          width: 245,
          characterId: 'sora',
          speaker: 'Sora',
          speakerColor: '#ff758c',
          dialogue: 'A new moment begins here.\nDouble-click to edit!',
          portsOut: [{ id: 'out_cyan', color: 'cyan', yOffset: 150 }]
        });
      } else if (type === 'choice') {
        state.nodes.push({
          id,
          type: 'choice',
          title: 'Node: Decision Split',
          subtitle: 'Choice Node',
          showAddButtons: true,
          x: offsetX,
          y: offsetY,
          width: 240,
          options: [
            { id: 'opt_1', label: 'Option A: "Take the path"', style: 'coral', inColor: 'cyan', outColor: 'coral' },
            { id: 'opt_2', label: 'Option B: "Stay behind"', style: 'teal', inColor: 'cyan', outColor: 'cyan' }
          ]
        });
      } else if (type === 'character_selector') {
        state.nodes.push({
          id,
          type: 'character_selector',
          title: 'Character Selector',
          x: offsetX,
          y: offsetY,
          width: 230,
          selectedCharId: 'yuki',
          expression: 'Yuki - Joyful',
          scale: 100,
          position: 50,
          inColor: 'coral'
        });
      } else {
        state.nodes.push({
          id,
          type: 'branch_scene',
          headerBar: `Node ${state.nodes.length + 1}: New Scene`,
          x: offsetX,
          y: offsetY,
          width: 250,
          characterId: 'aoi',
          speaker: 'Aoi',
          dialogue: 'Aoi: "Let\'s see where this leads!"',
          inColor: 'cyan'
        });
      }

      selectedNodeId = id;
      renderNodes();
      showToast('Added new node to canvas');
    }

    // =========================================================================
    // EXPORT TO STANDALONE PLAYABLE WEB (.HTML) & WIN (.EXE) BUILDER
    // =========================================================================
    function exportStandaloneHtml() {
      playSynthSfx('connect');
      const serialized = JSON.stringify({
        nodes: state.nodes,
        wires: state.wires,
        assets: CHARACTER_ASSETS
      });

      const standaloneHtml = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>${escapeHtml(state.projectName)} — Visual Novel</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#0b0f1f; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
  .stage { width:min(920px, 96vw); height:min(540px, 90vh); background:radial-gradient(circle at 50% 30%, #263566, #0b0f1f); border:2px solid #00f2fe; border-radius:20px; display:flex; flex-direction:column; justify-content:space-between; padding:24px; box-sizing:border-box; box-shadow:0 0 40px rgba(0,242,254,0.25); position:relative; }
  .sprite { max-height:240px; border-radius:16px; border:2px solid rgba(255,255,255,0.25); align-self:center; margin-top:20px; }
  .box { background:rgba(15,20,40,0.92); border:1px solid rgba(0,242,254,0.45); border-radius:16px; padding:20px; }
  .speaker { font-weight:700; color:#ff758c; margin-bottom:6px; }
  .choices { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  button { background:#1e294b; color:#fff; border:1px solid #00f2fe; padding:10px 16px; border-radius:10px; cursor:pointer; font-weight:600; }
  button:hover { background:#00f2fe; color:#0b0f1f; }
</style>
</head>
<body>
<div class="stage">
  <img id="sp" class="sprite" />
  <div class="box">
    <div id="spk" class="speaker"></div>
    <div id="dlg"></div>
    <div id="ch" class="choices"></div>
  </div>
</div>
<script>
const DATA = ${serialized};
function go(id) {
  const n = DATA.nodes.find(x => x.id === id) || DATA.nodes[0];
  if (!n) return;
  const c = DATA.assets[n.characterId || n.selectedCharId || 'sora'] || DATA.assets.sora;
  document.getElementById('sp').src = c.avatar;
  document.getElementById('spk').textContent = n.speaker || c.name;
  document.getElementById('dlg').textContent = n.dialogue || n.title || '';
  const ch = document.getElementById('ch');
  ch.innerHTML = '';
  const outs = DATA.wires.filter(w => w.fromNode === n.id);
  if (n.type === 'choice' && n.options) {
    n.options.forEach(o => {
      const w = outs.find(x => x.fromPort === 'out_' + o.id);
      const b = document.createElement('button');
      b.textContent = o.label;
      b.onclick = () => w ? go(w.toNode) : (document.getElementById('dlg').textContent = '[End of branch]');
      ch.appendChild(b);
    });
  } else if (outs.length) {
    const b = document.createElement('button');
    b.textContent = 'Continue →';
    b.onclick = () => go(outs[0].toNode);
    ch.appendChild(b);
  }
}
go(DATA.nodes[0]?.id);
<\/script>
</body>
</html>`;

      const blob = new Blob([standaloneHtml], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'My_Novel_Web_Build.html';
      a.click();
      showToast('Exported standalone Web (.html) build!');
    }

    function openExeExportModal() {
      playSynthSfx('click');
      const modal = document.getElementById('drawerModal');
      document.getElementById('drawerModalTitle').textContent = 'Windows (.exe) Standalone Packager';
      document.getElementById('drawerModalBody').innerHTML = `
        <div class="space-y-4">
          <div class="p-3.5 rounded-xl bg-[#101528] border border-cyan-500/30 flex items-center justify-between">
            <div>
              <div class="font-bold text-cyan-300 text-sm">My_Novel_Win64_Runtime.exe</div>
              <div class="text-xs text-slate-400">Bundles ${state.nodes.length} nodes, ${state.wires.length} neon links & 4 character sprites</div>
            </div>
            <span class="px-2.5 py-1 rounded bg-cyan-500/20 text-cyan-300 text-xs font-mono">Ready</span>
          </div>
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="p-3 rounded-xl bg-[#101528] border border-slate-700">
              <div class="text-slate-400">Resolution</div>
              <div class="font-semibold text-white mt-0.5">1920 × 1080 (Full HD)</div>
            </div>
            <div class="p-3 rounded-xl bg-[#101528] border border-slate-700">
              <div class="text-slate-400">Engine Backend</div>
              <div class="font-semibold text-white mt-0.5">DirectX / WebView2 Wrapper</div>
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button id="btnCloseExeModal" class="px-4 py-2 rounded-xl bg-slate-800 text-xs font-semibold text-slate-300">Close</button>
            <button id="btnConfirmExeDownload" class="px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 text-xs font-bold text-slate-950">
              Download Windows Build Manifest (.bat)
            </button>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
      document.getElementById('btnCloseExeModal').onclick = () => modal.classList.add('hidden');
      document.getElementById('btnConfirmExeDownload').onclick = () => {
        const batContent = `@echo off\r\necho Launching My Novel Visual Novel Runtime...\r\nstart "" "My_Novel_Web_Build.html"\r\n`;
        const blob = new Blob([batContent], { type: 'application/bat' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Launch_My_Novel.bat';
        a.click();
        modal.classList.add('hidden');
        showToast('Downloaded Windows Launcher & Manifest!');
      };
    }

    // =========================================================================
    // SWITCH BETWEEN PRESETS (View 1: Sora / View 2: Aoi / Blank)
    // =========================================================================
    function loadPreset(presetKey) {
      playSynthSfx('click');
      activePresetKey = presetKey;
      if (presetKey === 'sora') {
        state = JSON.parse(JSON.stringify(PRESET_SORA));
        selectedNodeId = 'start_scene_1';
      } else if (presetKey === 'aoi') {
        state = JSON.parse(JSON.stringify(PRESET_AOI));
        selectedNodeId = 'node_1_intro';
      } else {
        state = {
          projectName: 'My Novel (Custom)',
          zoom: 0.92,
          panX: 40,
          panY: 40,
          variables: { chapter: 1 },
          nodes: [
            {
              id: 'start_1',
              type: 'banner_scene',
              badge: 'Start Scene 1',
              x: 120,
              y: 120,
              width: 245,
              characterId: 'sora',
              speaker: 'Sora',
              speakerColor: '#ff758c',
              dialogue: 'Welcome to your new visual novel!\nAdd nodes below.',
              portsOut: [{ id: 'out_cyan', color: 'cyan', yOffset: 160 }]
            }
          ],
          wires: []
        };
        selectedNodeId = 'start_1';
      }

      // Update quick switcher pills
      const pillSora = document.getElementById('pillPresetSora');
      const pillAoi = document.getElementById('pillPresetAoi');
      if (presetKey === 'sora') {
        pillSora.className = 'px-3 py-1 rounded-full text-xs font-semibold transition bg-cyan-500/20 text-cyan-300 border border-cyan-400/40';
        pillAoi.className = 'px-3 py-1 rounded-full text-xs font-semibold transition text-slate-400 hover:text-white';
      } else if (presetKey === 'aoi') {
        pillAoi.className = 'px-3 py-1 rounded-full text-xs font-semibold transition bg-rose-500/20 text-rose-300 border border-rose-400/40';
        pillSora.className = 'px-3 py-1 rounded-full text-xs font-semibold transition text-slate-400 hover:text-white';
      }

      document.getElementById('currentProjectLabel').textContent = state.projectName;
      applyTransform();
      renderNodes();
    }

    // =========================================================================
    // WIRE UP ALL TOP/BOTTOM CONTROLS ON LOAD
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      // Project Dropdown
      const projBtn = document.getElementById('btnProjectDropdown');
      const projMenu = document.getElementById('projectDropdownMenu');
      projBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        projMenu.classList.toggle('hidden');
      });
      document.addEventListener('click', () => projMenu.classList.add('hidden'));

      document.querySelectorAll('.preset-option').forEach(btn => {
        btn.addEventListener('click', () => {
          loadPreset(btn.dataset.preset);
          projMenu.classList.add('hidden');
        });
      });

      document.getElementById('pillPresetSora').addEventListener('click', () => loadPreset('sora'));
      document.getElementById('pillPresetAoi').addEventListener('click', () => loadPreset('aoi'));

      // Top bar buttons
      document.getElementById('btnPlayPreviewTop').addEventListener('click', startPlaytest);
      document.getElementById('btnExportHtml').addEventListener('click', exportStandaloneHtml);
      document.getElementById('btnExportExe').addEventListener('click', openExeExportModal);
      document.getElementById('btnTopSettings').addEventListener('click', () => openWorkspaceTab('settings'));

      // Undo / Redo
      document.getElementById('btnUndo').addEventListener('click', () => {
        if (!historyStack.length) {
          showToast('Nothing to undo');
          return;
        }
        redoStack.push(JSON.parse(JSON.stringify({ nodes: state.nodes, wires: state.wires, variables: state.variables })));
        const prev = historyStack.pop();
        state.nodes = prev.nodes;
        state.wires = prev.wires;
        state.variables = prev.variables;
        playSynthSfx('click');
        renderNodes();
        showToast('Undid last action');
      });

      document.getElementById('btnRedo').addEventListener('click', () => {
        if (!redoStack.length) {
          showToast('Nothing to redo');
          return;
        }
        historyStack.push(JSON.parse(JSON.stringify({ nodes: state.nodes, wires: state.wires, variables: state.variables })));
        const next = redoStack.pop();
        state.nodes = next.nodes;
        state.wires = next.wires;
        state.variables = next.variables;
        playSynthSfx('click');
        renderNodes();
        showToast('Redid action');
      });

      // Zoom / Pan controls
      document.getElementById('btnZoomResetTop').addEventListener('click', () => {
        state.panX = 20;
        state.panY = 15;
        setZoom(0.92);
      });
      document.getElementById('btnResetView').addEventListener('click', () => {
        state.panX = 20;
        state.panY = 15;
        setZoom(0.92);
        showToast('View centered');
      });
      document.getElementById('btnZoomOutPill').addEventListener('click', () => setZoom(Math.max(0.45, state.zoom - 0.1)));
      document.getElementById('btnMinimapZoomOut').addEventListener('click', () => setZoom(Math.max(0.45, state.zoom - 0.1)));
      document.getElementById('btnMinimapZoomIn').addEventListener('click', () => setZoom(Math.min(1.5, state.zoom + 0.1)));
      document.getElementById('btnCenterCanvas').addEventListener('click', () => {
        state.panX = 20;
        state.panY = 15;
        applyTransform();
        renderWires();
      });
      document.getElementById('btnFitGraph').addEventListener('click', () => {
        state.panX = 30;
        state.panY = 20;
        setZoom(0.85);
      });

      // FAB Add Node
      document.getElementById('btnFabAddNode').addEventListener('click', () => openWorkspaceTab('nodes'));

      // Bottom Nav Tabs
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => openWorkspaceTab(btn.dataset.tab));
      });

      // Drawer close
      document.getElementById('btnCloseDrawer').addEventListener('click', () => {
        document.getElementById('drawerModal').classList.add('hidden');
      });

      // Playtest modal controls
      document.getElementById('btnClosePlaytest').addEventListener('click', () => {
        document.getElementById('playtestModal').classList.add('hidden');
      });
      document.getElementById('btnVnRestart').addEventListener('click', () => {
        if (state.nodes[0]) renderPlaytestStep(state.nodes[0].id);
      });
      document.getElementById('btnVnToggleAudio').addEventListener('click', (e) => {
        sfxEnabled = !sfxEnabled;
        e.currentTarget.textContent = sfxEnabled ? '🔊 SFX On' : '🔇 SFX Muted';
      });

      // Initial render
      applyTransform();
      renderNodes();
    });
  </script>
</body>
</html>
